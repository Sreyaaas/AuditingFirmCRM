<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Shameer and Associates · Accountants and Practitioners</title>

    <!-- PWA & Mobile Web App Meta -->
    <meta name="theme-color" content="#1B365D" />
    <meta name="description" content="Practice & Compliance CRM for Shameer & Associates — Accountants & Practitioners" />
    <meta name="application-name" content="S&A CRM" />
    <meta name="apple-mobile-web-app-title" content="S&A CRM" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
      (function() {
        try {
          var activeTheme = localStorage.getItem('crm-active-theme') || 'navy-light';
          document.documentElement.setAttribute('data-theme', activeTheme);
          document.documentElement.setAttribute('data-accents', localStorage.getItem('crm-colour-accents') === 'off' ? 'off' : 'on');
          if (activeTheme.endsWith('-dark')) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
